<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page-content">
      <div class="product-card">
        <div class="product-image">
          
          <picture>
            <source srcset="assets/img-desktop.jpg" media="(min-width:710px)">
            <img
            src="assets/img-mobile.jpg"
            alt="product"
          />
          </picture>
        </div>
        <div class="product-detail">
          <span>PERFUME</span>
          <h1>Gabrielle Essence Eau De Parfum</h1>
          <p>
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="price"><span class="new-price">$149.99 </span><span class="old-price">$169.99</span></div>
          <button class="btn-cart"><img src="assets/icon-cart.svg" alt=""> Add to Cart</button>
        </div>
      </div>
    </div>
  </body>
</html>
